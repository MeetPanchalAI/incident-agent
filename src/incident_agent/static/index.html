<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incident Agent</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%232f5fd0' d='M8 1 2 4v4.2c0 3.6 2.5 6.4 6 6.8 3.5-.4 6-3.2 6-6.8V4L8 1Zm.9 10.5H7.1V9.8h1.8v1.7Zm0-2.9H7.1V4.4h1.8v4.2Z'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #fbfbfc; --surface: #ffffff; --panel: #f4f5f7; --line: #e4e6ea;
    --text: #15181d; --muted: #6a7280; --faint: #9aa1ab;
    --accent: #2f5fd0; --warn: #9a5b00; --bad: #b02a2a; --ok: #1f7a4d;
    --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101216; --surface: #171a1f; --panel: #1d2127; --line: #2a2f37;
      --text: #e7e9ec; --muted: #98a0ac; --faint: #6d7684;
      --accent: #7aa2f7; --warn: #d8a657; --bad: #e07b7b; --ok: #6fbf95;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column;
    font: 15px/1.6 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, textarea { font: inherit; color: inherit; }

  /* ---- header ---- */
  header { border-bottom: 1px solid var(--line); background: var(--surface); flex: none; }
  .bar { display: flex; align-items: center; gap: 18px; padding: 10px 20px; }
  .brand { font-weight: 600; letter-spacing: -.01em; }
  nav { display: flex; gap: 2px; }
  .tab {
    border: 0; background: none; color: var(--muted); cursor: pointer;
    padding: 5px 12px; border-radius: 6px; font-size: 14px;
  }
  .tab:hover { color: var(--text); background: var(--panel); }
  .tab[aria-selected="true"] { color: var(--text); background: var(--panel); font-weight: 500; }
  .grow { flex: 1; }
  .btn {
    border: 1px solid var(--line); background: var(--surface); border-radius: 6px;
    padding: 6px 12px; font-size: 14px; cursor: pointer; white-space: nowrap;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.08); color: #fff; }
  .strip {
    padding: 7px 20px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted);
    font-family: ui-monospace, Menlo, Consolas, monospace; display: flex; gap: 8px; align-items: center;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex: none; }
  .dot.off { background: var(--faint); }

  /* ---- layout ---- */
  main { flex: 1; overflow-y: auto; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 28px 20px 40px; }
  footer { flex: none; border-top: 1px solid var(--line); background: var(--surface); }
  .composer { max-width: 820px; margin: 0 auto; padding: 12px 20px; display: flex; gap: 10px; }
  textarea {
    flex: 1; resize: none; padding: 10px 13px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--bg); line-height: 1.5;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  textarea:disabled { opacity: .6; }

  /* ---- empty state ---- */
  .hero { text-align: center; padding: 52px 0 24px; }
  .hero h2 { font-size: 19px; font-weight: 600; margin: 0 0 8px; letter-spacing: -.01em; }
  .hero p { color: var(--muted); margin: 0 auto 22px; max-width: 470px; }
  .suggestions { display: flex; flex-direction: column; gap: 8px; max-width: 520px; margin: 0 auto; }
  .suggestion {
    text-align: left; border: 1px solid var(--line); background: var(--surface);
    border-radius: var(--radius); padding: 10px 14px; cursor: pointer; color: var(--muted); font-size: 14px;
  }
  .suggestion:hover { border-color: var(--accent); color: var(--text); }

  /* ---- turns ---- */
  .turn { margin-bottom: 30px; }
  .ask {
    font-size: 16px; font-weight: 500; line-height: 1.5; margin-bottom: 16px;
    padding-left: 13px; border-left: 2px solid var(--accent); white-space: pre-wrap;
  }
  .lede { margin: 0 0 18px; }
  section.block { margin-bottom: 16px; }
  h3 {
    font-size: 11px; letter-spacing: .07em; text-transform: uppercase;
    color: var(--faint); margin: 0 0 7px; font-weight: 600;
  }
  ul { margin: 0; padding-left: 19px; }
  li { margin-bottom: 5px; }
  .cite { color: var(--faint); font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .tag {
    display: inline-block; font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase;
    padding: 1px 7px; border-radius: 10px; border: 1px solid var(--line);
    margin-right: 7px; vertical-align: 1px; color: var(--muted);
  }
  .tag.high { border-color: var(--accent); color: var(--accent); }
  .tag.medium { border-color: var(--warn); color: var(--warn); }
  .cause { padding: 10px 14px; background: var(--panel); border-radius: var(--radius); }
  .cause.none { color: var(--muted); }
  .note {
    border-radius: var(--radius); padding: 9px 13px; margin-bottom: 14px; font-size: 14px;
    border: 1px solid var(--bad); color: var(--bad);
  }
  .meta { color: var(--faint); font-size: 12.5px; }
  .flag {
    display: inline-flex; align-items: center; gap: 7px; margin-bottom: 22px;
    border: 1px solid var(--ok); color: var(--ok); border-radius: 999px; padding: 4px 13px; font-size: 13px;
  }

  /* ---- trace ---- */
  details { border: 1px solid var(--line); border-radius: var(--radius); margin-top: 16px; background: var(--surface); }
  summary {
    cursor: pointer; padding: 9px 14px; font-size: 13px; color: var(--muted);
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  summary:hover { color: var(--text); }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  td { padding: 7px 14px; border-top: 1px solid var(--line); vertical-align: top; }
  td.id { font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--faint); white-space: nowrap; width: 1%; }
  td.st { white-space: nowrap; width: 1%; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .call { font-family: ui-monospace, Menlo, Consolas, monospace; word-break: break-word; }
  .s-ok { color: var(--ok); } .s-empty { color: var(--faint); }
  .s-error, .s-timeout, .s-invalid_arguments, .s-duplicate, .s-budget_exceeded { color: var(--warn); }

  /* ---- monitoring ---- */
  .runs { width: 100%; border-collapse: collapse; font-size: 13px; }
  .runs th {
    text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--faint); font-weight: 600; padding: 0 12px 7px;
  }
  .runs td { padding: 8px 12px; border-top: 1px solid var(--line); vertical-align: top; }
  .runs tr.run { cursor: pointer; }
  .runs tr.run:hover td { background: var(--panel); }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .kind {
    font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; padding: 1px 7px;
    border-radius: 10px; border: 1px solid var(--line); color: var(--muted);
  }
  .lines { padding: 0 !important; }
  .lines table { font-size: 12px; background: var(--panel); }
  .lines td { border-top: 1px solid var(--line); padding: 5px 12px; }
  .l-warn { color: var(--warn); } .l-error { color: var(--bad); }
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .toolbar h2 { font-size: 17px; font-weight: 600; margin: 0; flex: 1; }

  /* ---- evaluation ---- */
  .card { border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; background: var(--surface); }
  .card h2 { margin: 0 0 6px; font-size: 17px; font-weight: 600; }
  .card p { color: var(--muted); margin: 0 0 16px; }
  .card ul { color: var(--muted); }
  label.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .res { font-weight: 600; }
  .res.PASS { color: var(--ok); } .res.FAIL { color: var(--bad); }
  .scores { display: flex; gap: 3px; }
  .sq { width: 13px; height: 13px; border-radius: 3px; background: var(--line); }
  .sq[data-v="2"] { background: var(--ok); } .sq[data-v="1"] { background: var(--warn); }
  .sq[data-v="0"] { background: var(--bad); }
  .pulse { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1.1s infinite; }
  @keyframes pulse { 0%, 100% { opacity: .25 } 50% { opacity: 1 } }
</style>
</head>
<body>

<header>
  <div class="bar">
    <span class="brand">Incident Agent</span>
    <nav>
      <button class="tab" id="tab-chat" aria-selected="true">Chat</button>
      <button class="tab" id="tab-eval" aria-selected="false">Evaluation</button>
      <button class="tab" id="tab-mon" aria-selected="false">Monitoring</button>
    </nav>
    <span class="grow"></span>
    <input type="file" id="file" accept=".jsonl,.json,.log,.txt" hidden>
    <button class="btn" id="upload">Upload data</button>
    <button class="btn" id="reset">New session</button>
  </div>
  <div class="strip"><span class="dot off" id="dot"></span><span id="summary">loading…</span></div>
</header>

<main>
  <div class="wrap">
    <div id="chat"><div id="log"></div><div id="hero"></div></div>
    <div id="mon" hidden>
      <div class="toolbar">
        <h2>Runs</h2>
        <button class="btn" id="mon-refresh">Refresh</button>
      </div>
      <div id="runs"></div>
    </div>
    <div id="eval" hidden>
      <div class="toolbar">
        <h2>Evaluation</h2>
        <label class="toggle"><input type="checkbox" id="eval-judge" checked> model judge</label>
        <button class="btn primary" id="eval-run">Run all 12</button>
      </div>
      <div id="eval-status" class="meta" style="margin-bottom:14px"></div>
      <div id="eval-results"></div>
      <div id="eval-history" style="margin-top:26px"></div>
    </div>
  </div>
</main>

<footer>
  <div class="composer">
    <textarea id="input" rows="2" placeholder="Upload a log file to begin." disabled></textarea>
    <button class="btn primary" id="send" disabled>Send</button>
  </div>
</footer>

<script>
const $ = id => document.getElementById(id);
const log = $('log'), hero = $('hero'), input = $('input'), send = $('send');
let sessionId = null, info = null;

const el = (tag, cls, text) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
};

const scroll = () => document.querySelector('main').scrollTo(0, 1e6);

// Which conversation this browser had open. The conversation itself lives in
// the database; this is only the pointer back to it.
function remember(id) {
  try { localStorage.setItem('session', id); } catch (error) { /* private window */ }
}

function remembered() {
  try { return localStorage.getItem('session'); } catch (error) { return null; }
}

function flag(text) {
  const node = el('div', 'flag');
  node.append(el('span', 'dot'), document.createTextNode(text));
  return node;
}

/* ---------- views ---------- */

function show(view) {
  ['chat', 'eval', 'mon'].forEach(name => {
    $(name).hidden = name !== view;
    $('tab-' + name).setAttribute('aria-selected', String(name === view));
  });
  document.querySelector('footer').hidden = view !== 'chat';
  if (view === 'chat' && !input.disabled) input.focus();
  if (view === 'mon') loadRuns();
  if (view === 'eval') loadEvaluation();
}

/* ---------- evaluation ---------- */

let evalTimer = null;

async function loadEvaluation() {
  const status = await (await fetch('/api/evaluations/status')).json();
  renderEvaluation(status);
  if (status.running && !evalTimer) evalTimer = setInterval(loadEvaluation, 2000);
  if (!status.running && evalTimer) { clearInterval(evalTimer); evalTimer = null; }
  if (!status.running) loadEvalHistory();
}

async function runEvaluation() {
  $('eval-run').disabled = true;
  try {
    await post('/api/evaluations/run', {judge: $('eval-judge').checked});
  } catch (error) {
    $('eval-status').replaceChildren(el('div', 'note', error.message));
    $('eval-run').disabled = false;
    return;
  }
  loadEvaluation();
}

function renderEvaluation(status) {
  const line = $('eval-status');
  $('eval-run').disabled = status.running;
  if (status.error) {
    line.replaceChildren(el('div', 'note', status.error));
  } else if (status.running) {
    const pending = el('span');
    pending.append(el('span', 'pulse'), document.createTextNode(
      ' Running... ' + status.done + ' of ' + status.total + ' scenarios scored.'));
    line.replaceChildren(pending);
  } else if (status.results.length) {
    const passed = status.results.filter(r => r.pass).length;
    const critical = status.results.filter(r => r.critical_error).length;
    line.textContent = passed + '/' + status.results.length + ' passed, ' + critical + ' with a critical error.';
  } else {
    line.textContent = 'Runs the twelve scenarios against the loaded dataset. Takes a few minutes.';
  }
  $('eval-results').replaceChildren(status.results.length ? resultsTable(status.results) : el('span'));
}

function resultsTable(results) {
  const table = el('table', 'runs');
  const head = table.createTHead().insertRow();
  ['', 'Result', 'Tools', 'Scores', 'Scenario', 'Notes'].forEach(name => {
    const cell = document.createElement('th');
    cell.textContent = name;
    head.append(cell);
  });
  const body = table.createTBody();
  results.forEach(r => {
    const row = body.insertRow();
    row.insertCell().append(el('span', 'mono', r.scenario_id));
    row.insertCell().append(el('span', 'res ' + (r.pass ? 'PASS' : 'FAIL'), r.pass ? 'PASS' : 'FAIL'));
    row.insertCell().append(el('span', 'mono', r.required_tool_coverage));
    const scores = el('div', 'scores');
    Object.entries(r.judge_scores).forEach(([name, value]) => {
      const square = el('span', 'sq');
      square.dataset.v = value;
      square.title = name.replace(/_/g, ' ') + ': ' + value + '/2';
      scores.append(square);
    });
    row.insertCell().append(scores);
    row.insertCell().textContent = r.title;
    const notes = [];
    if (r.critical_error) notes.push(...r.critical_reasons);
    if (r.missing_tools.length) notes.push('missing ' + r.missing_tools.join(', '));
    Object.entries(r.deterministic_checks).filter(([, ok]) => !ok)
      .forEach(([name]) => notes.push('failed check: ' + name.replace(/_/g, ' ')));
    if (r.unnecessary_tool_calls) notes.push(r.unnecessary_tool_calls + ' wasted calls');
    if (!notes.length && r.judge_reason) notes.push(r.judge_reason);
    row.insertCell().append(el('span', r.critical_error ? 'l-error' : 'cite', notes.join('; ')));
  });
  return table;
}

async function loadEvalHistory() {
  const data = await (await fetch('/api/evaluations/runs')).json();
  if (!data.runs.length) { $('eval-history').replaceChildren(); return; }
  const box = el('div');
  box.append(el('h3', null, 'Past runs'));
  const table = el('table', 'runs');
  const body = table.createTBody();
  data.runs.forEach(run => {
    const row = body.insertRow();
    row.className = 'run';
    row.insertCell().append(el('span', 'mono', (run.started_at || '').slice(0, 16).replace('T', ' ')));
    row.insertCell().append(el('span', 'mono', run.dataset || ''));
    row.insertCell().textContent = run.passed + '/' + run.total + ' passed';
    row.insertCell().append(el('span', run.critical ? 'l-error' : 'cite',
      run.critical ? run.critical + ' critical' : 'no critical errors'));
    row.addEventListener('click', async () => {
      const past = await (await fetch('/api/evaluations/runs/' + run.id)).json();
      renderEvaluation({running: false, results: past.results, total: past.results.length, error: null});
    });
  });
  box.append(table);
  $('eval-history').replaceChildren(box);
}

/* ---------- monitoring ---------- */

const clock = iso => (iso || '').slice(11, 19);
const secs = ms => ms == null ? '' : (ms >= 1000 ? (ms / 1000).toFixed(1) + 's' : ms + 'ms');

async function loadRuns() {
  const {runs} = await (await fetch('/api/runs?limit=60')).json();
  const table = el('table', 'runs');
  const head = table.createTHead().insertRow();
  ['Time', 'Kind', 'Status', 'Took', 'Summary'].forEach(name => {
    const cell = document.createElement('th');
    cell.textContent = name;
    head.append(cell);
  });
  const body = table.createTBody();
  if (!runs.length) {
    body.insertRow().insertCell().append(el('span', 'meta', 'Nothing has run yet.'));
  }
  runs.forEach(run => {
    const row = body.insertRow();
    row.className = 'run';
    row.insertCell().append(el('span', 'mono', clock(run.started_at)));
    row.insertCell().append(el('span', 'kind', run.kind));
    row.insertCell().append(el('span', run.status === 'error' ? 'l-error' : '', run.status || 'running'));
    row.insertCell().append(el('span', 'mono', secs(run.duration_ms)));
    row.insertCell().textContent = run.summary || run.label || '';
    row.addEventListener('click', () => toggleRun(row, run.id));
  });
  $('runs').replaceChildren(table);
}

async function toggleRun(row, id) {
  const next = row.nextElementSibling;
  if (next && next.dataset.detail === id) { next.remove(); return; }
  const {logs} = await (await fetch('/api/runs/' + id)).json();
  const holder = row.parentNode.insertRow(row.rowIndex);
  holder.dataset.detail = id;
  const cell = holder.insertCell();
  cell.colSpan = 5;
  cell.className = 'lines';
  const inner = el('table');
  logs.forEach(line => {
    const r = inner.insertRow();
    r.insertCell().append(el('span', 'mono', clock(line.at)));
    r.insertCell().append(el('span', 'mono l-' + line.level, line.event));
    const text = r.insertCell();
    text.append(el('div', null, line.message));
    if (line.data) text.append(el('div', 'cite',
      Object.entries(line.data).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join('  ')));
  });
  cell.append(inner);
}

function suggestions() {
  const [first, second] = info.busiest.length ? info.busiest : info.services;
  return [
    `Was anything wrong with ${first} yesterday afternoon?`,
    `Why did ${second || first} start failing? Investigate and tell me what to check next.`,
    `What does ${first} depend on?`,
  ];
}

function renderHero() {
  hero.replaceChildren();
  if (log.children.length) return;
  const box = el('div', 'hero');
  if (!info || !info.dataset) {
    box.append(el('h2', null, 'No data loaded'));
    box.append(el('p', null,
      'Upload a JSONL log file to investigate. One JSON object per line, with ts, service, level and '
      + 'message. latency_ms, target and deployment events unlock the rest of the tools.'));
    const button = el('button', 'btn primary', 'Upload data');
    button.addEventListener('click', () => $('file').click());
    box.append(button);
  } else {
    box.append(el('h2', null, 'Ask about ' + info.dataset.filename));
    box.append(el('p', null,
      `${info.dataset.event_count.toLocaleString()} events across ${info.services.length} services, `
      + `${info.dataset.first_ts.slice(0, 10)} to ${info.dataset.last_ts.slice(0, 10)}.`));
    const list = el('div', 'suggestions');
    suggestions().forEach(text => {
      const button = el('button', 'suggestion', text);
      button.addEventListener('click', () => { input.value = text; ask(); });
      list.append(button);
    });
    box.append(list);
  }
  hero.append(box);
}

/* ---------- one turn ---------- */

function block(parent, title, items, render) {
  if (!items || !items.length) return;
  const section = el('section', 'block');
  section.append(el('h3', null, title));
  const ul = el('ul');
  items.forEach(item => ul.append(render ? render(item) : el('li', null, item)));
  section.append(ul);
  parent.append(section);
}

function renderResponse(parent, r) {
  if (r.unverified) parent.append(el('div', 'note', 'Unverified: this response failed validation.'));
  parent.append(el('p', 'lede', r.message));

  block(parent, 'Observed facts', r.observed_facts, f => {
    const li = el('li', null, f.statement + ' ');
    li.append(el('span', 'cite', f.evidence_ids.join(' ')));
    return li;
  });

  block(parent, 'Hypotheses', r.hypotheses, h => {
    const li = el('li');
    li.append(el('span', 'tag ' + h.confidence, h.confidence));
    li.append(document.createTextNode(h.statement + ' '));
    const bits = [];
    if (h.supporting_evidence_ids.length) bits.push('from ' + h.supporting_evidence_ids.join(' '));
    if (h.contradicting_evidence_ids.length) bits.push('against ' + h.contradicting_evidence_ids.join(' '));
    if (h.missing_evidence.length) bits.push('missing: ' + h.missing_evidence.join('; '));
    if (bits.length) li.append(el('span', 'cite', bits.join(' · ')));
    return li;
  });

  if (r.hypotheses.length || r.response_type === 'investigation_report') {
    const section = el('section', 'block');
    section.append(el('h3', null, 'Likely cause'));
    section.append(el('div', r.likely_cause ? 'cause' : 'cause none',
      r.likely_cause || 'Inconclusive — the evidence does not support a single cause.'));
    parent.append(section);
  }

  block(parent, 'Recommended actions', r.recommended_actions);
  block(parent, 'Gaps', r.gaps);
  block(parent, 'Assumptions', r.assumptions);
  block(parent, 'Warnings', r.warnings);
}

function renderTrace(parent, data) {
  const details = el('details');
  details.append(el('summary', null,
    `${data.trace.length} tool calls · ${data.llm_calls} model calls · ${data.steps} steps`
    + (data.stopped_early ? ' · stopped early' : '')));
  if (data.trace.length) {
    const table = el('table');
    data.trace.forEach(t => {
      const row = table.insertRow();
      const id = row.insertCell();
      id.className = 'id';
      id.textContent = t.observation_id;
      const status = row.insertCell();
      status.className = 'st';
      status.append(el('span', 's-' + t.status, t.status + (t.attempts > 1 ? ` x${t.attempts}` : '')));
      const args = Object.entries(t.args).map(([k, v]) => `${k}=${v}`).join(', ');
      row.insertCell().append(el('div', 'call', `${t.tool}(${args})`), el('div', 'cite', t.summary));
    });
    details.append(table);
  }
  parent.append(details);
}

/* ---------- requests ---------- */

async function post(path, body) {
  const response = await fetch(path, {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body),
  });
  const data = await response.json();
  if (!response.ok) throw new Error(data.detail || response.statusText);
  return data;
}

async function ask() {
  const message = input.value.trim();
  if (!message || send.disabled) return;
  input.value = '';
  send.disabled = true;
  hero.replaceChildren();

  const turn = el('div', 'turn');
  turn.append(el('div', 'ask', message));
  const pending = el('div', 'meta');
  pending.append(el('span', 'pulse'), document.createTextNode(' Investigating… 0s'));
  turn.append(pending);
  log.append(turn);
  scroll();

  const started = Date.now();
  const tick = setInterval(() => {
    pending.lastChild.textContent = ` Investigating… ${Math.round((Date.now() - started) / 1000)}s`;
  }, 1000);

  try {
    const data = await post('/api/chat', {message, session_id: sessionId});
    sessionId = data.session_id;
    remember(sessionId);
    pending.remove();
    renderResponse(turn, data.response);
    renderTrace(turn, data);
  } catch (error) {
    pending.remove();
    turn.append(el('div', 'note', error.message));
  } finally {
    clearInterval(tick);
    send.disabled = !(info && info.dataset);
    input.focus();
    scroll();
  }
}

async function upload(file) {
  send.disabled = true;
  log.replaceChildren();
  const busy = el('div', 'hero');
  busy.append(el('h2', null, 'Ingesting ' + file.name));
  busy.append(el('p', null, 'Reading events and deriving metrics…'));
  hero.replaceChildren(busy);

  const body = new FormData();
  body.append('file', file);
  try {
    const response = await fetch('/api/ingest', {method: 'POST', body});
    const report = await response.json();
    if (!response.ok) throw new Error(report.detail || response.statusText);
    sessionId = null;
    await async function restore() {
  const saved = remembered();
  if (!saved || !info || !info.dataset) return;
  const response = await fetch('/api/sessions/' + saved);
  if (!response.ok) return;
  const stored = await response.json();
  if (stored.dataset !== info.dataset.filename || !stored.turns.length) return;
  sessionId = saved;
  hero.replaceChildren();
  stored.turns.forEach(data => {
    const turn = el('div', 'turn');
    turn.append(el('div', 'ask', data.question));
    renderResponse(turn, data.response);
    renderTrace(turn, data);
    log.append(turn);
  });
  scroll();
}

refresh().then(restore);
    hero.firstChild.prepend(flag('Data ingested'));
  } catch (error) {
    hero.replaceChildren();
    log.replaceChildren(el('div', 'note', 'Ingest failed: ' + error.message));
  } finally {
    input.focus();
  }
}

async function reset() {
  const data = await post('/api/reset', {});
  sessionId = data.session_id;
  remember(sessionId);
  log.replaceChildren();
  renderHero();
  input.focus();
}

async function refresh() {
  info = await (await fetch('/health')).json();
  const d = info.dataset;
  $('dot').className = 'dot' + (d ? '' : ' off');
  $('summary').textContent = d
    ? `${d.filename} · ${d.event_count.toLocaleString()} events · ${info.services.length} services `
      + `· ${d.first_ts.slice(0, 10)} to ${d.last_ts.slice(0, 10)}`
      + (d.skipped ? ` · ${d.skipped} skipped` : '')
    : 'no dataset loaded';
  send.disabled = !d;
  input.disabled = !d;
  input.placeholder = d ? 'Ask about the data…' : 'Upload a log file to begin.';
  if (!info.configured) {
    log.prepend(el('div', 'note', 'OPENAI_API_KEY is not set. Add it to .env and restart the server.'));
  }
  renderHero();
}

$('tab-chat').addEventListener('click', () => show('chat'));
$('tab-eval').addEventListener('click', () => show('eval'));
$('tab-mon').addEventListener('click', () => show('mon'));
$('mon-refresh').addEventListener('click', loadRuns);
$('eval-run').addEventListener('click', runEvaluation);
$('upload').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', event => {
  if (event.target.files.length) upload(event.target.files[0]);
  event.target.value = '';
});
$('reset').addEventListener('click', reset);
send.addEventListener('click', ask);
input.addEventListener('keydown', event => {
  if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); ask(); }
});

async function restore() {
  const saved = remembered();
  if (!saved || !info || !info.dataset) return;
  const response = await fetch('/api/sessions/' + saved);
  if (!response.ok) return;
  const stored = await response.json();
  if (stored.dataset !== info.dataset.filename || !stored.turns.length) return;
  sessionId = saved;
  hero.replaceChildren();
  stored.turns.forEach(data => {
    const turn = el('div', 'turn');
    turn.append(el('div', 'ask', data.question));
    renderResponse(turn, data.response);
    renderTrace(turn, data);
    log.append(turn);
  });
  scroll();
}

refresh().then(restore);
</script>
